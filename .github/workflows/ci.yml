name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        run: make test
      - name: Smoke test
        run: |
          .build/release/sapu --version
          .build/release/sapu big . --json > /dev/null
          .build/release/sapu dupes . --json > /dev/null
